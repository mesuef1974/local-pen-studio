    <text class="small" x="1858" y="750" text-anchor="start" direction="rtl">وحد الصورة 40 مليون بكسل</text>
    <text class="small" x="1858" y="829" text-anchor="start" direction="rtl">المخرج: صورة موحّدة للمعالجة</text>
  </g>

