    <path d="M1640 285H1880" stroke="#16847e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1863" cy="327" r="18" fill="#16847e"/>
    <text class="number" x="1863" y="332" text-anchor="middle">01</text>
