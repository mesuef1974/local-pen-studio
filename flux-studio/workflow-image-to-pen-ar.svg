    <path d="M360 285H600" stroke="#647d87" stroke-width="6" stroke-linecap="round"/>
    <circle cx="583" cy="327" r="18" fill="#647d87"/>
    <text class="number" x="583" y="332" text-anchor="middle">05</text>
    <text class="cardhead" x="578" y="385" text-anchor="start" direction="rtl">تدقيق المطابقة</text>
