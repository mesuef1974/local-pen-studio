<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
  <title id="title">من إدخال الصورة إلى خطة رسم القلم</title>
  <desc id="desc">مخطط عربي يشرح مراحل مسار: استيراد الصورة، التهيئة الاختيارية، المراجعة والاعتماد، استخراج المسارات، تدقيق المطابقة، ثم تخطيط القلم والمحاكاة والتصدير. يوضح أين يعمل المعالج وأين يعمل كرت الشاشة.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123c4a"/>
      <stop offset="1" stop-color="#0d5d62"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#123c4a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#16847e"/>
    </marker>
    <style>
      text{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif}
      .title{font-size:48px;font-weight:750;fill:#fff}
      .subtitle{font-size:21px;fill:#d8eceb}
      .section{font-size:15px;font-weight:700;letter-spacing:.4px;fill:#587079}
      .card{fill:#fff;stroke:#dce8e9;stroke-width:1.5}
      .cardhead{font-size:24px;font-weight:750;fill:#163f4a}
      .body{font-size:17px;fill:#38515a}
      .small{font-size:14px;fill:#637981}
      .number{font-size:15px;font-weight:750;fill:#fff}
      .tag{font-size:14px;font-weight:700}
      .rule{stroke:#e3ebec;stroke-width:1.2}
      .arrow{fill:none;stroke:#16847e;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .bullet{fill:#16847e}
    </style>
  </defs>

  <rect width="1920" height="1280" fill="#f4f8f8"/>
  <path d="M0 0H1920V205H0Z" fill="url(#header)"/>
  <rect x="48" y="47" width="1824" height="112" rx="20" fill="#ffffff" opacity=".055"/>
  <text class="title" x="960" y="105" text-anchor="middle" direction="rtl">من إدخال الصورة إلى خطة رسم القلم</text>
  <text class="subtitle" x="960" y="143" text-anchor="middle" direction="rtl">خطوات المعالجة، مصدر الحساب، ونقطة اعتماد الصورة في منصة مسار</text>

  <text class="section" x="1880" y="248" text-anchor="start" direction="rtl">اتجاه المسار: من اليمين إلى اليسار</text>
  <g transform="translate(1270 226)">
    <rect width="88" height="28" rx="14" fill="#d8efed"/>
    <circle cx="17" cy="14" r="4" fill="#16847e"/>
    <text class="tag" x="74" y="19" text-anchor="start" fill="#11635f" direction="rtl">CPU</text>
  </g>
  <g transform="translate(1165 226)">
    <rect width="88" height="28" rx="14" fill="#dcecff"/>
    <circle cx="17" cy="14" r="4" fill="#3976c5"/>
    <text class="tag" x="74" y="19" text-anchor="start" fill="#285d9e" direction="rtl">GPU</text>
  </g>
  <g transform="translate(1035 226)">
    <rect width="112" height="28" rx="14" fill="#f9ecd4"/>
    <circle cx="17" cy="14" r="4" fill="#c08228"/>
    <text class="tag" x="98" y="19" text-anchor="start" fill="#825719" direction="rtl">اختياري</text>
  </g>

