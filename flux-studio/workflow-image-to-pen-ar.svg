    <rect x="688" y="784" width="224" height="48" rx="12" fill="#eaf4f3"/>
    <text class="tag" x="898" y="814" text-anchor="start" fill="#11635f" direction="rtl">الناتج: مسارات ونقاط x,y</text>
  </g>

  <g filter="url(#shadow)">
