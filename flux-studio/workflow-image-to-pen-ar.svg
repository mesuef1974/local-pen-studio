    <rect x="1008" y="751" width="224" height="81" rx="12" fill="#fff6e7"/>
    <text class="small" x="1218" y="782" text-anchor="start" fill="#815719" direction="rtl">التغيير على مدخل سابق</text>
    <text class="small" x="1218" y="806" text-anchor="start" fill="#815719" direction="rtl">يتطلب اعتمادًا جديدًا</text>
