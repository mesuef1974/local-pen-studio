    <circle class="bullet" cx="1217" cy="492" r="4"/>
    <text class="body" x="1202" y="498" text-anchor="start" direction="rtl">راجع الصورة الناتجة</text>
    <circle class="bullet" cx="1217" cy="541" r="4"/>
