      <text class="tag" x="82" y="20" text-anchor="start" fill="#285d9e" direction="rtl">GPU</text>
      <text class="small" x="212" y="20" text-anchor="start" direction="rtl">BiRefNet · CUDA</text>
    </g>
    <path class="rule" d="M1328 615H1552"/>
    <text class="small" x="1538" y="655" text-anchor="start" direction="rtl">اختر الأدوات التي تحتاجها فقط</text>
    <text class="small" x="1538" y="680" text-anchor="start" direction="rtl">الصورة الأصلية محفوظة</text>
    <rect x="1328" y="731" width="224" height="101" rx="12" fill="#fff6e7"/>
    <text class="small" x="1538" y="762" text-anchor="start" fill="#815719" direction="rtl">أي تعديل لاحق يبطل</text>
    <text class="small" x="1538" y="786" text-anchor="start" fill="#815719" direction="rtl">الموافقة والمسارات التابعة</text>
