version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /masar-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Django stays on the 5.2 LTS series until the owner approves a major upgrade.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
