name: Repository checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 scripts/repository_policy.py
      - run: python3 scripts/test_repository_policy.py
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks against full fetched history
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          status=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" . || status=$?
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'gitleaks.json'
          if report.exists():
              for finding in json.loads(report.read_text()):
                  print({key: finding.get(key) for key in ['RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint']})
          PY
          exit "$status"
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python -m unittest test_process_guard
      - run: python -m unittest test_editor_ops test_background_service test_lineart_tools test_input_adjustments
        working-directory: drawing-simulator
      - run: python -m unittest test_preparation
        working-directory: trace-studio
      - run: python -m unittest test_generation test_server
        working-directory: pipeline-studio
      - run: python -m unittest test_generation
        working-directory: flux-studio
      - name: Physical pen raster fidelity (Cairo on Linux)
        if: runner.os == 'Linux'
        run: python -m unittest test_fidelity
        working-directory: flux-studio
      - run: python -m unittest test_processing test_presets
        working-directory: edge-studio
  javascript:
    name: JavaScript (${{ matrix.os }})
    env:
      PYTHONUTF8: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.1.1
      - run: node --test flux-studio/test-api-client.mjs flux-studio/test-core.mjs flux-studio/test-paper.mjs flux-studio/test-prompts.mjs
      - run: node --test test-controller.mjs test-core.mjs
        working-directory: pipeline-studio
      - run: node --test test-editor-geometry.cjs test-lineart-workflow.cjs test-path-order.cjs test-path-refinement.cjs test-worker-ink.cjs
        working-directory: drawing-simulator
      - run: node --test test-workflow.cjs test-preparation-ui.cjs
        working-directory: trace-studio
      - run: node --test test-presets.cjs test-workflow.cjs
        working-directory: edge-studio
  gate:
    name: Quality gate
    if: always()
    needs: [policy, secrets, python, javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Required checks did not succeed: ' + ', '.join(failed))
              sys.exit(1)
          print('All required checks passed. No deployment is performed.')
          PY
