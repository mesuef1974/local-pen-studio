name: Repository checks
on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main, staging, production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/repository_policy.py
      - run: python3 scripts/test_repository_policy.py
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks against full fetched history
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          python3 - <<'PY'
          import os, secrets
          from pathlib import Path
          probe = Path(os.environ['RUNNER_TEMP']) / 'secret-scan-probe'
          probe.mkdir()
          (probe / 'probe.txt').write_text('api' + '_key = "' + secrets.token_hex(32) + '"')
          PY
          probe_status=0
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --exit-code=42 "$RUNNER_TEMP/secret-scan-probe" || probe_status=$?
          if [ "$probe_status" -ne 42 ]; then
            echo 'Secret scanner failed its positive detection test.'
            exit 1
          fi
          status=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" . || status=$?
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'gitleaks.json'
          if report.exists():
              for finding in json.loads(report.read_text()):
                  print({key: finding.get(key) for key in ['RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint']})
          PY
          exit "$status"
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python -m unittest test_process_guard
      - run: python scripts/test_handoff.py
      - run: python scripts/test_handoff_bridge.py
      - run: python scripts/test_handoff_coordinator.py
      - run: python scripts/test_prune_old_outputs.py
      - run: python -m unittest discover -p 'test_*.py'
        working-directory: drawing-simulator
      # Listed on purpose: trace-studio/test_processing.py needs the locally installed trace skill.
      - run: python -m unittest test_preparation
        working-directory: trace-studio
      - run: python -m unittest discover -p 'test_*.py'
        working-directory: pipeline-studio
      - name: FLUX tests, including pen raster fidelity (system Cairo on Linux, pycairo wheel on Windows)
        run: python -m unittest discover -p 'test_*.py'
        working-directory: flux-studio
      - run: python -m unittest discover -p 'test_*.py'
        working-directory: edge-studio
  javascript:
    name: JavaScript (${{ matrix.os }})
    env:
      PYTHONUTF8: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0
      - run: node --test --experimental-test-coverage test-*.mjs
        working-directory: flux-studio
      - run: node --test test-*.mjs
        working-directory: pipeline-studio
      - run: node --test test-*.cjs test-*.mjs
        working-directory: drawing-simulator
      - run: node --test test-*.cjs
        working-directory: trace-studio
      - run: node --test test-*.cjs
        working-directory: edge-studio
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install ruff==0.15.9
      - run: ruff check .
      - run: npm ci --ignore-scripts
      - run: npm run lint
  browser:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # Drives the Chrome already on the runner; no browser download.
      - run: python -m pip install -r .github/requirements-ci.txt playwright==1.58.0
      - run: python flux-studio/browser_smoke.py --channel chrome
  gate:
    name: Quality gate
    if: always()
    needs: [policy, secrets, python, javascript, lint, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Required checks did not succeed: ' + ', '.join(failed))
              sys.exit(1)
          print('All required checks passed. No deployment is performed.')
          PY
